name: PR File Manager

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  manage-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref || github.event.pull_request.head.ref }}


      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


      - name: Create or Update File
        if: github.event.action == 'opened' || github.event.action == 'synchronize'
        run: |
          echo "This file was auto-generated for PR #${{ github.event.number }}" > pr-status.txt
          echo "Last updated on: $(date)" >> pr-status.txt
          git add pr-status.txt
          git commit -m "chore: update pr-status.txt [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.event.pull_request.head.ref }}


      - name: Delete File on Merge
        if: github.event.pull_request.merged == true
        run: |
          if [ -f pr-status.txt ]; then
            git rm pr-status.txt
            git commit -m "chore: remove pr-status.txt after merge [skip ci]"
            git push origin ${{ github.event.pull_request.base.ref }}
          else
            echo "File not found, nothing to delete."
          fi