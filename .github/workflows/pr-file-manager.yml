name: PR File Manager

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main] # This triggers specifically when a merge happens

jobs:
  manage-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --- LOGIC FOR PRs ---
      - name: Create or Update File
        if: github.event_name == 'pull_request'
        run: |
          echo "PR #${{ github.event.number }} active" > pr-status.txt
          git add pr-status.txt
          git commit -m "chore: update pr-status.txt [skip ci]" || echo "No changes"
          git push origin ${{ github.event.pull_request.head.ref }}

      # --- LOGIC FOR LANDING ON MAIN ---
      - name: Create or Update File
        if: github.event_name == 'pull_request'
        run: |
          echo "PR #${{ github.event.number }} active" > pr-status.txt
          git add pr-status.txt
          git commit -m "chore: update pr-status.txt [skip ci]" || echo "No changes"
          # Using HEAD:refs/heads/... ensures the push finds the right branch
          git push origin HEAD:${{ github.event.pull_request.head.ref }}