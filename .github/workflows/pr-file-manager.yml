name: PR File Manager

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  manage-file:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --- LOGIC FOR PRs ---
      - name: Update file in PR branch
        if: github.event_name == 'pull_request'
        run: |
          echo "PR #${{ github.event.number }} active" > pr-status.txt

          git add pr-status.txt
          git commit -m "chore: update pr-status.txt [skip ci]" || echo "No changes"

          git push \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            HEAD:${{ github.event.pull_request.head.ref }}

      # --- LOGIC AFTER MERGE TO MAIN ---
      - name: Update file on main
        if: github.event_name == 'push'
        run: |
          # 1. Explicitly remove the temporary PR file
          rm -f pr-status.txt 
          
          # 2. Create the success marker
          echo "Merged into main at $(date)" > merged-status.txt

          # 3. Commit the cleanup
          git add .
          git commit -m "chore: cleanup PR artifacts and update status [skip ci]" || echo "No changes"
          git push